{% load i18n %}
{% if page_obj.has_other_pages %}
<nav aria-label="{% translate 'Page navigation' %}">
    <ul class="pagination">
        {% if page_obj.has_previous %}
            <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}{% if selected_action %}&action={{ selected_action }}{% endif %}{% if actor %}&actor={{ actor|urlencode }}{% endif %}">&laquo;</a></li>
        {% endif %}
        {% for num in page_obj.paginator.page_range %}
            <li class="page-item {% if num == page_obj.number %}active{% endif %}">
                <a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ num }}{% if selected_action %}&action={{ selected_action }}{% endif %}{% if actor %}&actor={{ actor|urlencode }}{% endif %}">{{ num }}</a>
            </li>
        {% endfor %}
        {% if page_obj.has_next %}
            <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}{% if selected_action %}&action={{ selected_action }}{% endif %}{% if actor %}&actor={{ actor|urlencode }}{% endif %}">&raquo;</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
