{% load i18n %}<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="width:100%;max-width:600px;background-color:#ffffff;border-radius:8px;padding:24px;">
                <tr>
                    <td style="font-family:Arial,Helvetica,sans-serif;color:#212529;">
                        <p style="font-size:13px;color:#6c757d;margin:0 0 4px;">{% translate "Darts Penalty Manager" %}</p>
                        <h1 style="font-size:20px;margin:0 0 16px;">{% block subject %}{% endblock %}</h1>
                        {% block content %}{% endblock %}
                        <hr style="border:none;border-top:1px solid #dee2e6;margin:24px 0 12px;">
                        <p style="font-size:12px;color:#6c757d;margin:0;">
                            {% translate "This is an automated message from the Darts Penalty Manager." %}
                            {% if support_email %}<br>{% translate "Support" %}: {{ support_email }}{% endif %}
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
