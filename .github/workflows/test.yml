name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reusable so docker-publish.yml / release.yml can GATE their builds on this
  # exact workflow (review L3) instead of duplicating the steps.
  workflow_call:

# Cancel in-progress runs for same branch/PR.
# This workflow is ALSO called via `workflow_call` (docker-publish.yml,
# release.yml) — and inside a called workflow `github.workflow` resolves to the
# CALLER's name, so the plain `${{ github.workflow }}-${{ github.ref }}` group
# would be identical to the caller's own top-level concurrency group. GitHub
# then cancels the run: "deadlock was detected for concurrency group … between
# a top level workflow and 'test'". The fixed `tests-` prefix keeps this group
# unique no matter who calls it.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Install GNU gettext (msgfmt)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Compile message catalogs
        run: python manage.py compilemessages

      - name: Tests with coverage gate (>= 80%)
        run: pytest --cov=config --cov=app --cov-fail-under=80
