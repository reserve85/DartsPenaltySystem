name: Release

on:
  release:
    types: [published]

# Cancel in-progress runs for same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/darts_penalty_system

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/reserve85/darts_penalty_system:main
            ghcr.io/reserve85/darts_penalty_system:${{ steps.version.outputs.VERSION }}
            ghcr.io/reserve85/darts_penalty_system:${{ github.sha }}
            ghcr.io/reserve85/darts_penalty_system:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.release.created_at }}
            APP_VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release artifact
        run: |
          echo "Release ${{ steps.version.outputs.VERSION }}" > release_info.txt
          echo "Git SHA: ${{ github.sha }}" >> release_info.txt
          echo "Build Date: ${{ github.event.release.created_at }}" >> release_info.txt
          echo "Release: ${{ github.event.release.html_url }}" >> release_info.txt
          echo "Image: ghcr.io/reserve85/darts_penalty_system:${{ steps.version.outputs.VERSION }}" >> release_info.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-info-${{ steps.version.outputs.VERSION }}
          path: release_info.txt
          retention-days: 7
