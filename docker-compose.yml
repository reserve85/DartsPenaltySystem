services:
  app:
    build:
      context: .
      args:
        # Build metadata shown in the footer (v1.0.38 (a718e32) · Build …)
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        APP_VERSION: ${APP_VERSION:-0.1.0}
    restart: unless-stopped
    ports:
      - "${BIND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - dart_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dart_data:
